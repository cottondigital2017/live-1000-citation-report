# .github/workflows/citation.yml
# Weekly AI citation report — 1000 Boulevard of the Arts
# Runs every Monday at 8:00 AM ET (12:00 UTC), or manually via Run workflow.
# NOTE: No push trigger — commits will NOT start a run.

name: Weekly AI citation report — 1000 Boulevard of the Arts

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  run-citation-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run citation agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: node index.js --now

      - name: Upload report artifact (backup copy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citation-report
          path: report-*.html
          if-no-files-found: ignore
